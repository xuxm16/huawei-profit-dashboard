<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华为穿戴备货看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0e1a;color:#e0e6f0;padding:20px}
.title-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #1e2a3a}
.title-bar h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#42d4f5,#c678dd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lock{font-size:13px;color:#7a8ba8}
.lock input{padding:5px 10px;border:1px solid #2a3a50;border-radius:6px;background:#131c2e;color:#e0e6f0;outline:none}
.lock input:focus{border-color:#42d4f5}
.unlock{color:#42d4f5;font-size:13px;margin-bottom:0}
.unlock span{color:#98a8be;font-size:12px;margin-left:10px;cursor:pointer;text-decoration:underline}
.hidden{display:none}
.tabs{display:flex;gap:4px;margin-bottom:20px}
.tab{padding:8px 20px;border:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;background:#131c2e;color:#7a8ba8;transition:all .2s}
.tab.active{background:#1a2540;color:#42d4f5;font-weight:600}
.tab:hover:not(.active){color:#42d4f5}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:#131c2e;border:1px solid #1e2a3a;border-radius:12px;padding:16px;text-align:center}
.kpi .label{font-size:12px;color:#7a8ba8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-size:28px;font-weight:700;color:#fff}
.kpi .value.red{color:#ff6b6b}
.kpi .value.green{color:#69db7c}
.kpi .sub{font-size:11px;color:#5a6a80;margin-top:4px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:#131c2e;border:1px solid #1e2a3a;border-radius:12px;padding:16px}
.panel-title{font-size:14px;font-weight:600;color:#98a8be;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#1e2a3a;color:#42d4f5;font-size:11px;padding:2px 8px;border-radius:20px}
.chart-wrap{position:relative;height:260px;overflow:hidden}
/* Pure CSS Bar Chart */
.bar-chart{display:flex;align-items:flex-end;height:100%;gap:6px;padding-bottom:28px;position:relative}
/* Horizontal grid lines */
.bar-chart::before{content:'';position:absolute;left:0;right:0;bottom:28px;top:0;background:repeating-linear-gradient(to top,transparent,transparent 49px,#1a2235 49px,#1a2235 50px);pointer-events:none}
/* Baseline */
.bar-chart::after{content:'';position:absolute;left:0;right:0;bottom:28px;height:1px;background:#2a3a50;z-index:1}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer;z-index:2}
.bar-col:hover .bar-fill{opacity:.85}
.bar-fill{width:100%;border-radius:3px 3px 0 0;transition:opacity .15s;min-height:2px}
.bar-label{position:absolute;bottom:-26px;font-size:10px;color:#5a6a80;white-space:nowrap;transform:rotate(-45deg);transform-origin:top left;overflow:hidden;max-width:100%}
.bar-value{position:absolute;top:-18px;font-size:10px;color:#98a8be;white-space:nowrap;opacity:0;transition:opacity .15s}
.bar-col:hover .bar-value{opacity:1}
/* Line chart (pure CSS/SVG) */
.line-chart{position:relative;height:230px}
.line-chart svg{width:100%;height:100%}
/* Stats */
.stat{font-size:12px;color:#7a8ba8;margin-top:6px}
.stat strong{color:#fff}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;background:#1a2540;color:#7a8ba8;font-weight:600;border-bottom:1px solid #2a3a50;font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #1a2235;color:#c8d4e8}
tr:hover td{background:#1a2540}
.qty{font-weight:700;color:#42d4f5}
.rank{color:#5a6a80;width:32px}
.cat-badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;background:#1e2a3a;color:#98a8be}
.chan-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;flex-shrink:0}
.chan-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid #1a2235}
.chan-name{flex:1;color:#c8d4e8;font-size:13px}
.chan-qty{font-weight:700;color:#42d4f5;font-size:13px;min-width:60px;text-align:right}
.chan-pct{color:#5a6a80;font-size:11px;min-width:40px;text-align:right}
.chan-bar-bg{flex:2;height:4px;background:#1a2235;border-radius:2px;margin:0 10px}
.chan-bar{height:4px;border-radius:2px;transition:width .6s ease}
.chan-row:last-child{border-bottom:none}
@media(max-width:900px){
.kpi-grid{grid-template-columns:repeat(3,1fr)}
.chart-row{grid-template-columns:1fr}
}
</style>
</head>

// Pure CSS bar chart renderer
function renderBarChart(containerId, data, maxVal, colorFn, labelKey, valueKey, unit) {
  var el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  data.forEach(function(item, i) {
    var label = item[labelKey || 0];
    var val = item[valueKey || 1];
    var col = document.createElement('div');
    col.className = 'bar-col';
    var pct = maxVal > 0 ? (val / maxVal * 100).toFixed(1) : 0;
    col.innerHTML =
      '<div class="bar-value">' + val.toLocaleString() + (unit||'') + '</div>' +
      '<div class="bar-fill" style="height:' + pct + '%;background:' + colorFn(i, val) + '"></div>' +
      '<div class="bar-label">' + label + '</div>';
    el.appendChild(col);
  });
}

      '<div class="bar-fill" style="height:' + pct + '%;background:linear-gradient(to top,#42d4f5,#61afef)"></div>' +
      '<div class="bar-label">' + DAILY_LABELS[i] + '</div>';
    el.appendChild(col);
  });
}

// Render category bar chart
function renderCatsChart() {
  var cats = PERIODS[0].cats;
  var cats_sorted = cats.slice().sort(function(a,b){ return b[1].qty - a[1].qty; });
  document.getElementById('cat-pill').textContent = cats_sorted.length + '个';
  var max = cats_sorted[0][1].qty;
  var el = document.getElementById('chart-cats');
  el.innerHTML = '';
  cats_sorted.forEach(function(item, i) {
    var pct = (item[1].qty / max * 100).toFixed(1);
    var col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML =
      '<div class="bar-value">' + item[1].qty + '</div>' +
      '<div class="bar-fill" style="height:' + pct + '%;background:' + COLORS[i % COLORS.length] + '"></div>' +
      '<div class="bar-label" title="' + item[0] + '">' + item[0].replace('华为 ','').replace('Watch ','W.') + '</div>';
    el.appendChild(col);
  });
}

// Render channel bars
function renderChanChart() {
  var chans = PERIODS[0].chans;
  var total = chans.reduce(function(s, c){ return s + c[1].qty; }, 0);
  var el = document.getElementById('chan-list');
  el.innerHTML = '';
  chans.forEach(function(item, i) {
    var pct = (item[1].qty / total * 100).toFixed(1);
    var row = document.createElement('div');
    row.className = 'chan-row';
    row.innerHTML =
      '<div class="chan-name"><span class="chan-dot" style="background:' + CHAN_COLORS[i] + '"></span>' + item[0] + '</div>' +
      '<div class="chan-bar-bg"><div class="chan-bar" style="width:' + pct + '%;background:' + CHAN_COLORS[i] + '"></div></div>' +
      '<div class="chan-qty">' + item[1].qty.toLocaleString() + '</div>' +
      '<div class="chan-pct">' + pct + '%</div>';
    el.appendChild(row);
  });
}

// Render product table
function renderProds() {
  var prods = PERIODS[0].prods;
  var cats = PERIODS[0].cats;
  var total = prods.reduce(function(s, p){ return s + p.qty; }, 0);
  // Group by product name to dedupe
  var seen = {};
  var unique = [];
  prods.forEach(function(p) {
    var key = p.name + '|' + p.chan;
    if (!seen[key]) { seen[key] = true; unique.push(p); }
  });
  // Sort by qty desc
  unique.sort(function(a,b){ return b.qty - a.qty; });
  document.getElementById('prod-pill').textContent = unique.length + '个';
  var tbody = document.getElementById('prod-tbody');
  tbody.innerHTML = '';
  unique.forEach(function(p, i) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="rank">' + (i+1) + '</td>' +
      '<td>' + p.name + '</td>' +
      '<td><span class="cat-badge">' + p.cat.replace('华为 ','').replace('Watch ','W.') + '</span></td>' +
      '<td>' + p.chan.replace('华为比特专卖','比特').replace('华为思行汇数','思行汇').replace('拼多多平台','拼多多') + '</td>' +
      '<td class="qty">' + p.qty.toLocaleString() + '</td>' +
      '<td>' + p.rev.toFixed(1) + '</td>' +
      '<td style="color:#69db7c">' + p.profit.toFixed(2) + '</td>';
    tbody.appendChild(tr);
  });
}

// Render top10
function renderTop10() {
  var prods = PERIODS[0].prods;
  var total = prods.reduce(function(s, p){ return s + p.qty; }, 0);
  var seen = {};
  var unique = [];
  prods.forEach(function(p) {
    var key = p.name;
    if (!seen[key]) {
      seen[key] = true;
      unique.push({name: p.name, cat: p.cat, qty: 0});
    }
  });
  prods.forEach(function(p) {
    unique.forEach(function(u){ if(u.name === p.name) u.qty += p.qty; });
  });
  unique.sort(function(a,b){ return b.qty - a.qty; });
  var top = unique.slice(0, 10);
  var tbody = document.getElementById('top10-tbody');
  tbody.innerHTML = '';
  top.forEach(function(p, i) {
    var pct = (p.qty / total * 100).toFixed(1);
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="rank">' + (i+1) + '</td>' +
      '<td>' + p.name + '</td>' +
      '<td><span class="cat-badge">' + p.cat.replace('华为 ','').replace('Watch ','W.') + '</span></td>' +
      '<td class="qty">' + p.qty.toLocaleString() + '</td>' +
      '<td>' + pct + '%</td>';
    tbody.appendChild(tr);
  });
}

// Render KPI
function renderKPI() {
  var cats = PERIODS[0].cats;
  var chans = PERIODS[0].chans;
  var prods = PERIODS[0].prods;
  var daily = PERIODS[0].daily;
  var totalQty = cats.reduce(function(s,c){ return s+c[1].qty; }, 0);
  var totalRev = cats.reduce(function(s,c){ return s+c[1].rev; }, 0);
  var totalProfit = cats.reduce(function(s,c){ return s+c[1].profit; }, 0);
  var days = daily.length;
  var seen = {}; var uniq = 0;
  prods.forEach(function(p){ if(!seen[p.name]){ seen[p.name]=true; uniq++; }});
  document.getElementById('k-qty').textContent = totalQty.toLocaleString();
  document.getElementById('k-rev').textContent = totalRev.toFixed(0);
  document.getElementById('k-profit').textContent = totalProfit.toFixed(0);
  document.getElementById('k-prods').textContent = uniq;
  document.getElementById('k-daily').textContent = Math.round(totalQty / days);
}

// Render forecast
function renderForecast() {
  var cats = PERIODS[0].cats;
  var total3 = cats.reduce(function(s,c){ return s+c[1].qty; }, 0);
  var p4 = Math.round(total3 * 0.95);
  var p5 = Math.round(total3 * 0.90);
  var p6 = Math.round(total3 * 1.05);
  var r618 = Math.round(p5 * 1.3);
  document.getElementById('f-real').textContent = total3.toLocaleString();
  document.getElementById('f-p4').textContent = p4.toLocaleString();
  document.getElementById('f-p5').textContent = p5.toLocaleString();
  document.getElementById('f-p6').textContent = p6.toLocaleString();
  document.getElementById('f-618').textContent = r618.toLocaleString();
  // Monthly forecast bar chart
  var months = [
    {label:'3月\n实际', val: total3, color:'#42d4f5'},
    {label:'4月\n预测', val: p4, color:'#61afef'},
    {label:'5月\n预测', val: p5, color:'#98c379'},
    {label:'6月\n预测', val: p6, color:'#c678dd'}
  ];
  var maxM = Math.max.apply(null, months.map(function(m){ return m.val; }));
  var el = document.getElementById('chart-forecast');
  el.innerHTML = '';
  months.forEach(function(m) {
    var pct = (m.val / maxM * 100).toFixed(1);
    var col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML =
      '<div class="bar-value">' + m.val.toLocaleString() + '</div>' +
      '<div class="bar-fill" style="height:' + pct + '%;background:' + m.color + '"></div>' +
      '<div class="bar-label" style="transform:none;text-align:center;white-space:pre">' + m.label + '</div>';
    el.appendChild(col);
  });
  // Category forecast bars
  var cats_sorted = cats.slice().sort(function(a,b){ return b[1].qty - a[1].qty; });
  var fcats = cats_sorted.map(function(c) {
    return {label: c[0].replace('华为 ','').replace('Watch ','W.'), val: Math.round(c[1].qty * 0.95)};
  });
  var maxF = fcats[0].val;
  var el2 = document.getElementById('chart-fcats');
  el2.innerHTML = '';
  fcats.forEach(function(f, i) {
    var pct = (f.val / maxF * 100).toFixed(1);
    var col = document.createElement('div');
    col.className = 'bar-col';
    col.innerHTML =
      '<div class="bar-value">' + f.val + '</div>' +
      '<div class="bar-fill" style="height:' + pct + '%;background:' + COLORS[i % COLORS.length] + '"></div>' +
      '<div class="bar-label" title="' + f.label + '">' + f.label + '</div>';
    el2.appendChild(col);
  });
}

function renderAll() {
  renderKPI();
  renderDailyChart();
  renderCatsChart();
  renderChanChart();
  renderProds();
  renderTop10();
  renderForecast();
}
